# H2-database til tests
spring.datasource.url=jdbc:h2:mem:testdb;MODE=MySQL;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Opret og fjern tabeller automatisk under tests
spring.jpa.hibernate.ddl-auto=create-drop

# Dummy-værdi til InitData under tests (ikke en rigtig adgangskode)
SEED_ADMIN_PASSWORD=test-password-kun-til-test
SEED_INSTRUCTOR_PASSWORD=test
SEED_MEMBER_PASSWORD=test
